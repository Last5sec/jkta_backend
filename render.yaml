##############################################################################
# Render Blueprint for JKTA Backend (Express + Node.js)
#
# Deploying:
#   1. Go to https://portal.render.com/blueprints
#   2. Connect your GitHub account
#   3. Select the "Last5sec/jkta_backend" repository
#   4. Render reads this file and creates the web service automatically
#
# Environment: after creation Render COPIES this repo's env keys into the
# service dashboard. Open the service -> Environment and fill in the REAL
# secret values (DB_URL, Cloudinary, Razorpay, SMTP), then click Manual
# Deploy -> Clear build cache & deploy.
##############################################################################

services:
  - type: web
    name: jkta-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_RAZORPAY
        value: "false"
      - key: PORT
        value: "3000"
      # ---- Fill these in via the Render dashboard after creation ----
      - key: DB_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false